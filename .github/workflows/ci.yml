name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Smoke pipeline with fake providers
        env:
          LLM_PROVIDER: fake
          GATE_EDITOR: fake
          TTS_PROVIDER: fake
          STORAGE_PROVIDER: fs
          FS_STORAGE_DIR: ./out/storage
          DEFAULT_TENANT_ID: 00000000-0000-4000-8000-000000000001
        run: pnpm smoke

      - name: Golden eval (offline judge)
        env:
          LLM_PROVIDER: fake
          GATE_EDITOR: fake
        run: pnpm eval:golden
